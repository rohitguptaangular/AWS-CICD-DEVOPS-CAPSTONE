# Ansible configuration for this project.
# NOTE: in ansible.cfg (INI format) comments must be on their OWN line —
# inline comments after a value get parsed as part of the value.

[defaults]
inventory = inventory.ini
remote_user = ec2-user
private_key_file = ~/.ssh/jenkins-key.pem
host_key_checking = False
deprecation_warnings = False

[privilege_escalation]
become = True
