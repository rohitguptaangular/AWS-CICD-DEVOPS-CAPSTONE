# Helm values for kube-prometheus-stack. Trimmed for a 2-node t3.medium cluster.

prometheus:
  prometheusSpec:
    retention: 3d
    # Discover our ServiceMonitors/PrometheusRules regardless of release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi
    # The Jenkins API token is mounted from a Secret created out-of-band, the
    # same way the Alertmanager SMTP password is, so no token lands in git:
    #   kubectl create secret generic jenkins-token -n monitoring \
    #     --from-literal=token=<api token from Jenkins>
    secrets:
      - jenkins-token
    # Jenkins runs on EC2, outside the cluster, so there is no Service for a
    # ServiceMonitor to select. It is scraped as a plain static target instead.
    # The address is the Jenkins private IP, which changes whenever the
    # bootstrap module is destroyed and re-applied - update it after a rebuild
    # with: terraform -chdir=terraform/bootstrap output -raw jenkins_private_ip
    additionalScrapeConfigs:
      - job_name: jenkins
        # Trailing slash matters, /prometheus redirects with a 302.
        metrics_path: /prometheus/
        basic_auth:
          username: admin
          password_file: /etc/prometheus/secrets/jenkins-token/token
        static_configs:
          - targets:
              - 10.0.1.212:8080
            labels:
              instance: herovire-jenkins

grafana:
  # Demo credential - override with --set grafana.adminPassword or a secret.
  adminPassword: admin
  service:
    # Switched to LoadBalancer in the deploy step (task 5.9).
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    # SMTP password comes from a Secret created out-of-band (kept out of git).
    secrets:
      - alertmanager-smtp
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: eiron.rohit@gmail.com
      smtp_auth_username: eiron.rohit@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: email
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        # Watchdog fires constantly by design - drop it instead of emailing.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: email
        email_configs:
          - to: eiron.rohit@gmail.com
            send_resolved: true
      - name: "null"
